services:
  postgres:
    image: postgres:16-alpine
    container_name: netguardia-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: netguardia
      POSTGRES_PASSWORD: netguardia_prod_password
      POSTGRES_DB: netguardia
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/schema.postgres.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U netguardia -d netguardia"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
